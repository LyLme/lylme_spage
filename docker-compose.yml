services:
  # Web服务 - Apache + PHP 8.2 + MariaDB (单容器方案)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lylme/lylme_spage:latest
    container_name: lylme_spage
    ports:
      - "80:80"
    volumes:
      - lylme_data:/var/www/html
      - mysql_data:/var/lib/mysql
    networks:
      - lylme_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# 持久化卷
volumes:
  lylme_data:
    driver: local
    name: lylme_web_data
  mysql_data:
    driver: local
    name: lylme_mysql_data

# 内部网络
networks:
  lylme_network:
    driver: bridge
    name: lylme_network