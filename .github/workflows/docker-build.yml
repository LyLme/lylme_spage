name: Docker 多架构构建推送

# 替代本地 build-push.py，在 CI 中完成 amd64 / armv7 / arm64 三架构构建并推送
# 版本号自动从 www/include/version.php 读取（define('VERSION', '2.7.0')）

on:
  # 只由 tag 触发构建；workflow_dispatch 留作手动补构建。
  #
  # 刻意不写 branches / paths：
  #   1) 官方文档明确「Path filters are not evaluated for pushes of tags.」——
  #      paths 对 tag 推送根本不生效，写了只会让人误以为它在起作用；
  #   2) 原先的 branches: docker + paths（Dockerfile、www/** …）本意是「源码变更即构建」，
  #      但实测三次命中 paths 的 docker 分支推送均未产生任何运行，该入口不成立，已移除。
  #      源码由 sync-docker-branch.yml 同步进 docker 分支，再由打 tag 发布镜像。
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: '构建的分支/标签（Dockerfile 所在处，默认 docker 分支）'
        required: false
        default: 'docker'
      platforms:
        description: '目标架构列表'
        required: false
        default: 'linux/amd64,linux/arm/v7,linux/arm64'
      push_latest:
        description: '是否同时推送 latest 标签'
        required: false
        type: boolean
        default: true

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: lylme/lylme_spage

jobs:
  build:
    name: buildx 多架构构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # Dockerfile 只存在于 docker 分支，因此默认固定切到 docker 分支。
          # 注意：这意味着 tag 触发时构建的也是 docker 分支的最新代码，
          # 而非该 tag 所处的 commit —— 请严格按「推 master → 等 sync-docker-branch.yml
          # 跑完 → 再打 tag」的顺序操作，否则下面的版本号校验会失败。
          # 手动触发时可指定 ref 覆盖。
          ref: ${{ github.event.inputs.ref || 'docker' }}
          fetch-depth: 0

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -m1 "VERSION" www/include/version.php | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 www/include/version.php 解析 VERSION"
            exit 1
          fi
          # tag 触发时，确保 tag 与 docker 分支源码版本一致，避免打出与实际内容不符的标签
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if [ "$TAGVER" != "$VERSION" ]; then
              echo "::error::tag v$TAGVER 与 docker 分支 www/include/version.php ($VERSION) 不一致"
              echo "::error::请先运行 sync-docker-branch.yml 同步源码，再重新打 tag"
              exit 1
            fi
          fi
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"          >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "检测到版本 v$VERSION"

      - name: 计算是否推送镜像
        id: gate
        env:
          # ⚠️ 这里的用户名必须用 vars（仓库「变量」），不能用 secrets（仓库「机密」）：
          #   GitHub 会把 secret 的值在日志和 Step Summary 中无条件替换成 ***，
          #   而本仓库用户名 lylme 正好是 IMAGE_NAME 的前缀，一旦放进 secret，
          #   摘要里的 lylme/lylme_spage:vX.Y.Z 会显示成 ***/***_spage:vX.Y.Z，
          #   ghcr.io/lylme/... 也会被连带打码（因为字符串值是同一个）。
          #   用户名本身不是敏感信息，只有 DOCKERHUB_TOKEN 需要放在 secrets。
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          ENABLE_GHCR: ${{ vars.ENABLE_GHCR }}
        run: |
          # 只有存在可用的推送目标（Docker Hub 凭证或 GHCR）时才推送，
          # 否则退化为纯构建校验，避免未认证导致的 push 失败。
          PUSH="false"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if [ -n "$DOCKERHUB_USERNAME" ] || [ "$ENABLE_GHCR" = "true" ]; then
              PUSH="true"
            else
              echo "::warning::未配置仓库变量 DOCKERHUB_USERNAME 且未启用 ENABLE_GHCR，本次仅构建不推送"
            fi
          fi
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            # 单独告警：ENABLE_GHCR=true 时上面那条整体告警不会触发，Docker Hub
            # 会「一声不响地」不推送 —— workflow 依然显示成功，镜像却停在旧版本。
            echo "::warning::仓库变量 DOCKERHUB_USERNAME 为空，本次不会推送 Docker Hub（Settings → Secrets and variables → Actions → Variables）"
          fi
          if [ "$ENABLE_GHCR" = "true" ]; then
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr=false" >> "$GITHUB_OUTPUT"
          fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # ⚠️ 这里要填 binfmt 的「架构名」，不是 Docker 的「平台名」：
          #   ARM 32 位（Docker 平台名 linux/arm/v7）对应 binfmt 的 "arm"
          #   写成 "arm/v7" 会被 binfmt 拒绝：installing: v7 unsupported architecture: v7
          # 后果就是 arm/v7 的模拟器没装上，构建时容器一启动就
          #   exec /bin/sh: exec format error
          # 用 all 一次注册全部架构，以后再加平台也不用改这里。
          platforms: all

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: ${{ steps.gate.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        if: ${{ steps.gate.outputs.ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        env:
          # 同 gate 步骤：用 vars 而非 secrets，否则摘要里的用户名会被打成 ***
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          ENABLE_GHCR: ${{ vars.ENABLE_GHCR }}
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          TAG: ${{ steps.ver.outputs.tag }}
          # 下面两个仅服务于「可选标签」，当前默认不推，保留以便随时加回
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          TAGS=""
          add_tag() {
            if [ -z "$TAGS" ]; then TAGS="$1"; else TAGS="$TAGS,$1"; fi
          }

          # 每个仓库固定只推两个标签：
          #   vX.Y.Z —— 固定版本，生产环境用这个（可精确回滚）
          #   latest —— 跟随最新版本，手动触发时传 push_latest=false 可关闭
          # 如需额外标签，取消下方对应注释即可。

          # Docker Hub 标签：仅在配置了凭证时生成，否则推送会因未认证失败
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            add_tag "${IMAGE_NAME}:${TAG}"
            # add_tag "${IMAGE_NAME}:${VERSION}"     # 无 v 前缀版本号，如 2.7.0
            # add_tag "${IMAGE_NAME}:${TAG}-${SHA}"  # 带构建号，如 v2.7.0-44ccba7
            if [ "$PUSH_LATEST" != "false" ]; then
              add_tag "${IMAGE_NAME}:latest"
            fi
          fi

          # GHCR 标签
          # ⚠️ 镜像仓库名必须全小写，而 github.repository_owner 保留账号原始大小写（LyLme），
          #   直接拼进 tag 会被 buildx 拒绝：
          #   invalid tag "ghcr.io/LyLme/lylme_spage:vX.Y.Z": repository name must be lowercase
          if [ "$ENABLE_GHCR" = "true" ]; then
            GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            add_tag "ghcr.io/${GHCR_OWNER}/lylme_spage:${TAG}"
            # add_tag "ghcr.io/${GHCR_OWNER}/lylme_spage:${TAG}-${SHA}"  # 带构建号
            if [ "$PUSH_LATEST" != "false" ]; then
              add_tag "ghcr.io/${GHCR_OWNER}/lylme_spage:latest"
            fi
          fi

          # 纯构建校验场景：给一个本地标签，保证 buildx 有输出
          if [ -z "$TAGS" ]; then
            add_tag "${IMAGE_NAME}:${TAG}"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "生成的标签: $TAGS"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm/v7,linux/arm64' }}
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=LyLme Spage
            org.opencontainers.image.description=六零导航页 - 简洁高效的上网导航
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 输出摘要
        run: |
          echo "### 🐳 镜像构建完成"                      >> "$GITHUB_STEP_SUMMARY"
          echo ""                                          >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本标签: \`${{ steps.ver.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交: \`${{ steps.ver.outputs.sha }}\`"    >> "$GITHUB_STEP_SUMMARY"
          echo "- 架构: \`${{ github.event.inputs.platforms || 'linux/amd64,linux/arm/v7,linux/arm64' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo ""                                          >> "$GITHUB_STEP_SUMMARY"
          echo '```'                                       >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```'                                       >> "$GITHUB_STEP_SUMMARY"
