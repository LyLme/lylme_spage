name: 自动镜像同步

# 将 master 分支的源码同步到 docker 分支的 www/ 目录，
# 避免 Dockerfile 构建时用的是过期代码。

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  # 用 GITHUB_TOKEN 调 workflow_dispatch API 主动触发 docker-build.yml 时需要写权限
  actions: write

jobs:
  sync:
    name: master → docker/www
    runs-on: ubuntu-latest

    steps:
      - name: 检出 docker 分支
        uses: actions/checkout@v5
        with:
          ref: docker
          fetch-depth: 0

      - name: 同步源码到 www/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 拉取 master 源码到临时目录
          # 用 origin/master（远程跟踪分支）而非 master：checkout 只为当前 ref
          # 创建本地分支，docker 分支上通常不存在本地 master，直接写 master 会报
          # "invalid reference: master"。
          rm -rf /tmp/master_src
          git worktree add /tmp/master_src origin/master

          # 覆盖 www/（--delete 保证删除 master 上已移除的文件）
          #
          # 必须加 --checksum：rsync 默认只比「文件大小 + mtime」。两次 checkout 的
          # mtime 可能落在同一秒，于是「大小相同但内容不同」的文件会被静默跳过
          # —— include/version.php（2.6.0 → 2.7.0）就因此没同步过去。
          #
          # 用 --exclude='.git'（不带斜杠）而非 '.git/'：worktree 根目录下的 .git
          # 是一个「文件」（指向真实 gitdir），带斜杠只能匹配目录，会把它漏进来。
          rsync -a --checksum --delete \
            --exclude='.git' \
            --exclude='.github/' \
            --exclude='install/install.lock' \
            --exclude='include/log.txt' \
            --exclude='admin/log.txt' \
            --exclude='files/' \
            --exclude='cache/' \
            --exclude='logs/' \
            /tmp/master_src/ www/

          # 兜底校验：www/ 必须与 master 源码逐字节一致。不一致就当场失败，
          # 避免把「看起来同步成功、实际仍是旧代码」的结果推到 docker 分支。
          if ! diff -r \
              -x .git -x .github -x install.lock -x log.txt \
              -x files -x cache -x logs \
              /tmp/master_src/ www/ > /tmp/sync_diff.txt 2>&1; then
            echo "::error::同步后 www/ 与 master 源码不一致，已中止"
            head -50 /tmp/sync_diff.txt
            exit 1
          fi
          echo "✓ 校验通过：www/ 与 master 源码完全一致"

          # 让 docker 分支也带上构建工作流。
          # 这一份是必需的：下面用 `gh workflow run docker-build.yml --ref docker`
          # 触发构建，而 workflow_dispatch 是按「指定 ref 上的文件」解析工作流的 ——
          # docker 分支若没有这个文件，dispatch 会直接失败。
          # （曾经的理由是「docker 分支没这个文件，同步推送就不会触发构建」，该说法
          # 已被实测推翻：三次命中 paths 的推送都没产生任何运行，触发路径不成立。）
          # rsync 用 --exclude='.github/' 跳过了整个目录，所以这里单独补这一份，
          # 既避免 docker 分支混入 php-lint / release 等只在 master 有意义的工作流，
          # 又保证两边内容不会漂移。
          mkdir -p .github/workflows
          cp /tmp/master_src/.github/workflows/docker-build.yml .github/workflows/docker-build.yml

          git worktree remove /tmp/master_src --force

          # 移除安装锁，保证镜像首次运行可自动初始化
          rm -f www/install/install.lock

      - name: 检测是否有变更
        id: diff
        run: |
          git add -A www .github/workflows/docker-build.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "www/ 无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=$(git diff --cached --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        id: push
        if: steps.diff.outputs.changed == 'true'
        env:
          # 可选：配置 SYNC_PAT（含 repo + workflow 权限的 PAT）后，docker 分支的提交
          # 会以 PAT 身份推送。下游构建不依赖它——下一步始终会显式 dispatch 一次。
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          VERSION=$(grep -m1 "VERSION" www/include/version.php | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -n1)
          git commit -m "chore(docker): 同步 master 源码 v${VERSION} ($(git rev-parse --short ${{ github.sha }}))"
          if [ -n "$SYNC_PAT" ]; then
            git push "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git" docker
            echo "used_pat=true" >> "$GITHUB_OUTPUT"
            echo "已用 SYNC_PAT 推送"
          else
            git push origin docker
            echo "used_pat=false" >> "$GITHUB_OUTPUT"
            echo "已用 GITHUB_TOKEN 推送"
          fi
          echo "同步文件数: ${{ steps.diff.outputs.changed_files }}"

      - name: 触发镜像构建
        # 无论推送走 PAT 还是 GITHUB_TOKEN，这里都显式触发一次构建：
        #   - GITHUB_TOKEN 的 push 不会触发下游工作流（GitHub 硬性规则），必须补 dispatch；
        #   - PAT 的 push 理论上会触发，但本仓库实测没有触发（docker 分支上的提交
        #     没有任何 check-run）。一旦依赖它，就会出现「同步成功、镜像没更新」的
        #     静默中断，所以不再把 dispatch 当作兜底，而是当作唯一可靠入口。
        # 代价只是可能多出一个运行：docker-build.yml 的 concurrency 组同为
        # refs/heads/docker 且 cancel-in-progress=true，后来的会取消先前的，
        # 最终仍只真正构建一次。
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run docker-build.yml --ref docker; then
            echo "✓ 已触发 docker-build.yml，可在 Actions 页查看构建进度"
          else
            echo "::warning::自动触发 docker-build.yml 失败，请到 Actions 页手动运行一次"
          fi
